# Configuração do pipeline de mineração das métricas DORA (Lab03).
# Ajuste a janela quando o professor publicar as datas oficiais do Lab03S01.

observation_window:
  # Janela de 12 meses — placeholder até as datas oficiais
  start: "2025-10-01"
  end: "2026-09-30"

sample:
  # Meta Lab03S02: no mínimo 300 repositórios após os filtros
  target_size: 300
  # Cota igual por faixa de estrelas (veja pipeline/selection.py). Sem isso, a amostra
  # se concentra nas faixas de menos estrelas, que são as primeiras da lista.
  stratify: true
  # Critérios mínimos de inclusão (seção 3 do enunciado)
  min_releases: 5
  min_workflow_runs: 50

github:
  # Token lido da variável de ambiente GITHUB_TOKEN (nunca commitado)
  api_base_url: "https://api.github.com"
  per_page: 100
  # Fatiamento por estrelas para ultrapassar o teto de 1.000 resultados/consulta
  star_ranges:
    - { min: 1000, max: 2000 }
    - { min: 2001, max: 5000 }
    - { min: 5001, max: 10000 }
    - { min: 10001, max: 25000 }
    - { min: 25001, max: 50000 }
    - { min: 50001, max: 100000 }
    - { min: 100001, max: null }
  # Qualquer cláusula extra na query de busca (opcional)
  search_extra_query: ""
  # Para ao atingir este nº de candidatos na busca (economiza cota).
  # Ignorado quando sample.stratify é true: nesse caso vale o limite por faixa abaixo.
  max_search_candidates: 500
  # Candidatos buscados por faixa no modo estratificado (1000 = teto da API de busca)
  max_candidates_per_range: 1000

paths:
  cache_dir: "data/cache"
  output_dir: "data/output"
  # Relativo a code/ — planilhas versionáveis na raiz do repositório
  validacao_dir: "../validacao"

# Amostra-ouro (Issue #23) — sementes fixas para reprodutibilidade
validation:
  n_repos: 60
  n_releases_per_repo: 5
  random_state_repos: 42
  random_state_releases: 42
  evaluators:
    - CaioVKodato
    - Henrique-volponi
    - Kjonps
